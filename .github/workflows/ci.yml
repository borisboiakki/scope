name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv provides older Pythons (3.9) that actions/setup-python no longer offers on recent runners
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: uv run --no-project --python ${{ matrix.python }} --with pyyaml --with pytest python -m pytest -q tests
