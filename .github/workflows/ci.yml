name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r tool/requirements.txt pytest
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m pytest -q tests
      - name: Template size limit (60 lines)
        run: |
          fail=0
          for f in skills/*/references/*.md tool/templates/*; do
            n=$(wc -l < "$f"); if [ "$n" -gt 60 ]; then echo "$f: $n lines"; fail=1; fi
          done
          exit $fail
